<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{STORE}</title>
  <meta name="description" content="一点物のヴィンテージ古着のセレクトショップ（準備中）">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&display=swap">
  <link rel="stylesheet" href="/css/site.css">
  <link rel="icon" href="/img/placeholder.svg">
</head>
<body>
<div id="site-header"></div>
<main>
<!-- 写真は style の --img を差し替え（例: url(/img/hero.jpg)） -->
  <section class="hero photo" style="--img:url(/img/hero.jpg)">
    <div class="hero__body">
      <h1>Vintage</h1>
      <p>その時にしか出会えない、一点物を。</p>
    </div>
  </section>

  <section class="section">
    <div class="container">
      <div class="section__head">
        <h2>New Arrivals</h2>
        <a class="more" href="/items.html">すべて見る →</a>
      </div>
      <p class="section__lead">新しく入荷したアイテム</p>
      <ul class="grid" data-new-items></ul>
    </div>
  </section>

  <section class="section section--sub">
    <div class="container">
      <h2>About</h2>
      <p class="section__lead">お店の紹介文（コンセプト・セレクトの考え方）がここに入ります。</p>
      <a class="btn" href="/items.html">商品一覧を見る</a>
    </div>
  </section>
</main>
<div id="site-footer"></div>
<script type="module" src="/js/pages/home.js"></script>
</body>
</html>
